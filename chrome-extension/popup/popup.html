<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Nexlev Studio</title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 14px;
      background: #070b14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 800;
      color: #10b981;
      font-size: 15px;
    }
    .card {
      background: #0f1626;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #04131a;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .muted {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="hdr">
    <span class="title">⚡ NEXLEV STUDIO</span>
    <span id="status-pill" style="color:#6ee7b7;font-weight:700;">Active</span>
  </div>
  <div class="card">
    <strong>YouTube Overlay &amp; Outlier Detector</strong>
    <div class="muted">Đã tự động gắn nhãn Outlier Score, RPM ước tính và nút Lưu Swipe trên mọi trang YouTube.com.</div>
  </div>
  <div class="card">
    <strong>Số ý tưởng đã lưu từ Extension:</strong> <span id="saved-count">0</span>
  </div>
  <button type="button" id="btn-open-dashboard" class="btn">
    📊 Mở Nexlev Studio Dashboard
  </button>
  <script src="popup.js"></script>
</body>
</html>
