<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Nexlev Studio</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background: #101216;
      color: #F3F5F8;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
    }
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 600;
      color: #F3F5F8;
      font-size: 14px;
    }
    .card {
      background: #171A20;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11.5px;
      color: #A6B0C0;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #101216;
      color: #F3F5F8;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #83A8FF;
      background: #83A8FF;
      color: #0B0E14;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
      margin-top: 6px;
    }
    .btn-secondary {
      background: #20242C;
      border-color: rgba(255, 255, 255, 0.14);
      color: #F3F5F8;
    }
    .muted {
      color: #6E7787;
      font-size: 11.5px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="hdr">
    <span class="title">Nexlev Studio v2.1</span>
    <span id="status-pill" style="color:#3CCB7F;font-weight:600;">Active</span>
  </div>

  <div class="card">
    <label style="display:flex;align-items:center;gap:8px;color:#F3F5F8;font-weight:500;cursor:pointer;">
      <input type="checkbox" id="toggle-overlay" checked />
      Hiển thị chỉ số Outlier dưới video YouTube
    </label>
    <div class="muted">Chỉ hiển thị hệ số Outlier khi kênh có ≥ 3 video cùng định dạng.</div>
  </div>

  <div class="card">
    <label for="ext-api-base">Máy chủ Nexlev (Local/LAN):</label>
    <input type="text" id="ext-api-base" value="http://127.0.0.1:3088" />

    <label for="ext-api-token">API Token cá nhân (Bắt buộc theo T01):</label>
    <input type="password" id="ext-api-token" placeholder="Dán API Token từ mục Quản trị / Sidebar..." />

    <button type="button" id="btn-save-config" class="btn btn-secondary">Lưu kết nối</button>
    <div id="config-msg" class="muted"></div>
  </div>

  <div class="card">
    <span>Đã lưu vào kho Ý tưởng:</span> <strong id="saved-count">0</strong>
  </div>

  <button type="button" id="btn-open-dashboard" class="btn">
    Mở Nexlev Workspace
  </button>
  <script src="popup.js"></script>
</body>
</html>
